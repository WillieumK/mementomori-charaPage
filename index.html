<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 MementoMori 巅峰使用率统计 &amp; 卡池轮转表</title>
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#0d0b14;
  --panel:rgba(255,255,255,.045);
  --panel-border:rgba(255,255,255,.09);
  --gold:#d9b26a;
  --accent:#7c6cf0;
  --text:#e8e6f0;
  --muted:#9a94ad;
  --up:#4ade80;
  --down:#ff7b7b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(124,108,240,.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(217,178,106,.10), transparent 60%),
    linear-gradient(180deg,#0d0b14 0%,#12101c 55%,#0a0910 100%);
  background-attachment:fixed;
}
.wrap{max-width:1200px;margin:0 auto;padding:36px 20px 60px}
header.top{
  text-align:center;
  padding:34px 20px 26px;
  border-bottom:1px solid var(--panel-border);
  margin-bottom:30px;
}
header.top h1{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:0 0 12px;
  font-size:32px;
  letter-spacing:1px;
}
h1 .logo{
  width:44px;
  height:44px;
  border-radius:10px;
  display:inline-block;
  vertical-align:middle;
  box-shadow:0 0 18px rgba(217,178,106,.35);
}
h1 .title-grad{
  background:linear-gradient(90deg,#f5e6c4,#d9b26a 45%,#a78bfa);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
header.top .subtitle{margin:0 0 14px;color:var(--muted);font-size:15px}
.badge{
  display:inline-block;
  padding:6px 14px;
  border:1px solid rgba(217,178,106,.4);
  border-radius:999px;
  color:var(--gold);
  font-size:13px;
  background:rgba(217,178,106,.08);
  margin:3px;
}
.badge .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:7px;vertical-align:1px;box-shadow:0 0 8px #4ade80}
.badge.cache-ok{color:#9be8b2;border-color:rgba(155,232,178,.4);background:rgba(155,232,178,.08)}
.badge.cache-warn{color:#ffcf9e;border-color:rgba(255,207,158,.4);background:rgba(255,207,158,.08)}
.toolbar{display:flex;justify-content:flex-end;gap:10px;margin:0 0 14px}
.toolbar button{
  background:linear-gradient(90deg,#7c6cf0,#5b4fd6);
  color:#fff;border:none;border-radius:999px;
  padding:8px 18px;font-size:13px;cursor:pointer;
  transition:filter .2s,transform .1s;
}
.toolbar button:hover{filter:brightness(1.12)}
.toolbar button:active{transform:scale(.97)}
section.card{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:16px;
  padding:22px 24px 26px;
  margin:0 0 26px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
section.card h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 16px;
  font-size:19px;
  color:#f1eef8;
}
section.card h2::before{
  content:"";
  width:5px;
  height:20px;
  border-radius:3px;
  background:linear-gradient(180deg,var(--gold),var(--accent));
}
.h2-note{color:var(--muted);font-size:12px;font-weight:400;margin-left:auto}
.table-wrap{
  overflow-x:auto;
  border:1px solid var(--panel-border);
  border-radius:10px;
  background:rgba(0,0,0,.18);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
thead th{
  position:sticky;
  top:0;
  background:#1c1730;
  color:var(--gold);
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  padding:10px 14px;
  border-bottom:1px solid rgba(217,178,106,.25);
}
tbody td{
  padding:9px 14px;
  white-space:nowrap;
  border-bottom:1px solid rgba(255,255,255,.05);
  vertical-align:middle;
}
tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
tbody tr:hover{background:rgba(124,108,240,.14)}
tbody tr:last-child td{border-bottom:none}
.cell-name{font-weight:600;color:#f1eef8}
.cell-ico{min-width:64px}
.cell-ico .ico{
  display:inline-block;
  width:52px;height:52px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid var(--panel-border);
  background:rgba(0,0,0,.3);
  vertical-align:middle;
}
.cell-ico img{width:100%;height:100%;object-fit:cover;display:block}
.cell-name .ico.sm{width:38px;height:38px;border-radius:8px;vertical-align:middle;margin-right:8px}
.cell-ico .empty{color:var(--muted);opacity:.5}
.cell-ico .icofallback{display:inline-block;width:52px;height:52px;line-height:52px;text-align:center;border-radius:10px;border:1px dashed var(--panel-border);color:var(--muted);font-size:12px}
.tag{
  display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;
  border:1px solid var(--panel-border);background:rgba(255,255,255,.05);
}
.tag.light{color:#ffe9a8;border-color:rgba(255,233,168,.45);background:rgba(255,233,168,.08)}
.tag.dark{color:#c9b8ff;border-color:rgba(201,184,255,.45);background:rgba(201,184,255,.08)}
.tag.blue{color:#9ecfff;border-color:rgba(158,207,255,.45);background:rgba(158,207,255,.08)}
.tag.red{color:#ffb4a8;border-color:rgba(255,180,168,.45);background:rgba(255,180,168,.08)}
.tag.green{color:#b5f0c3;border-color:rgba(181,240,195,.45);background:rgba(181,240,195,.08)}
.tag.gold{color:#ffe9a8;border-color:rgba(255,233,168,.45);background:rgba(255,233,168,.08)}
.rank{font-weight:700;color:var(--muted)}
.rank.top1{color:#ffd76a}
.rank.top2{color:#d7dbe8}
.rank.top3{color:#d9a066}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--muted)}
.usage-pct{font-weight:600;color:#f1eef8}
.usage-prev{color:var(--muted);font-size:13px}
.loading,.error{color:var(--muted);padding:30px;text-align:center}
.error{color:#ff9d9d}
.error a{color:#ffd0d0}
.spinner{
  display:inline-block;width:28px;height:28px;margin-bottom:10px;
  border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
  line-height:1.9;
}
footer a{color:#a99fd9}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><img class="logo" src="icon.png" alt="icon"><span class="title-grad">MementoMori 巅峰使用率统计 &amp; 卡池轮转表</span></h1>
    <p class="subtitle" id="page-title">《每日60秒，读懂Mmt》</p>
    <p>
      <span class="badge"><span class="dot"></span>在线读取 Google Sheets</span>
      <span class="badge" id="fetch-time">页面读取：—</span>
      <span class="badge" id="cache-time">缓存：—</span>
    </p>
  </header>

  <div class="toolbar">
    <button id="btn-refresh" onclick="load(true)">🔄 刷新数据</button>
  </div>

  <section class="card">
    <h2>巅峰使用率 · 今日排行<span class="h2-note" id="usage-note"></span></h2>
    <div class="table-wrap" id="tbl-usage"></div>
  </section>

  <section class="card">
    <h2>MMT 卡池 · 最新总览</h2>
    <div class="table-wrap" id="tbl-overview"></div>
  </section>

  <section class="card">
    <h2>MMT 卡池 · 属性限定记录</h2>
    <div class="table-wrap" id="tbl-elements"></div>
  </section>

  <footer>
    数据实时读取自 <a href="https://docs.google.com/spreadsheets/d/1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA" target="_blank" rel="noopener">卡池表</a>
    · <a href="https://docs.google.com/spreadsheets/d/1VrnhPswVqPPbbC-Gps_e9Um7tWulYg4BI66HMt_OBZw" target="_blank" rel="noopener">使用率表</a>
    · 角色图标来自 <a href="https://mentemori.icu" target="_blank" rel="noopener">mentemori.icu</a> · 页面每小时自动刷新
  </footer>
</div>

<script>
"use strict";

const CARD_SHEET_ID = "1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA";
const CARD0_GID = "157463114";
const CARD0_URL = "https://docs.google.com/spreadsheets/d/" + CARD_SHEET_ID + "/gviz/tq?gid=" + CARD0_GID + "&tqx=out:json";
const USAGE_SHEET_ID = "1VrnhPswVqPPbbC-Gps_e9Um7tWulYg4BI66HMt_OBZw";
const USAGE_GID = "1850986413";
const USAGE_URL = "https://docs.google.com/spreadsheets/d/" + USAGE_SHEET_ID + "/gviz/tq?gid=" + USAGE_GID + "&tqx=out:json";
const ICON_BASE = "https://mentemori.icu/assets/CHR_";
const ICON_SUFFIX = "_00_s.png";

const CACHE_KEY = "mmt_page_cache_v4";
const CACHE_TTL = 60 * 60 * 1000; // 缓存 1 小时
const USAGE_TOP = 20;

const ELEMENT_TAG = { "光":"light", "暗":"dark", "蓝":"blue", "红":"red", "绿":"green", "金":"gold" };
const ELEMENTS = [
  { name: "天光", attr: "光" },
  { name: "幽冥", attr: "暗" },
  { name: "忧蓝", attr: "蓝" },
  { name: "业红", attr: "红" },
  { name: "苍翠", attr: "绿" },
  { name: "流金", attr: "金" }
];

// ---------- gviz JSON 解析 ----------
function parseGvizJson(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  return JSON.parse(text.slice(start, end + 1));
}

// ---------- 日期 / 取值工具 ----------
function dateOrd(v){
  const m = /^Date\((\d+),(\d+),(\d+)\)$/.exec(String(v || ""));
  if (!m) return null;
  return Date.UTC(+m[1], +m[2], +m[3]);
}
function fmtMd(ord){
  const d = new Date(ord);
  return (d.getUTCMonth() + 1) + "/" + String(d.getUTCDate()).padStart(2, "0");
}
function getV(row, c){
  const cell = row && row.c ? row.c[c] : null;
  return cell ? cell.v : null;
}
function getF(row, c){
  const cell = row && row.c ? row.c[c] : null;
  return cell && cell.f ? cell.f : null;
}
function rowMaxOrd(r, cols){
  let best = null;
  for (const c of cols){
    const o = dateOrd(getV(r, c));
    if (o !== null && (best === null || o > best)) best = o;
  }
  return best;
}

// ---------- 卡池两张表：从 卡-0 原始数据直接计算 ----------
function computeCardTables(rows){
  const R = rows.slice(3, 153);          // 卡-0 第4~153行
  const ids = r => String(getV(r, 0) == null ? "" : getV(r, 0)).trim();
  const name = r => String(getV(r, 6) || "").trim();

  let maxH = null;
  for (const r of R){ const o = dateOrd(getV(r, 7)); if (o !== null && (maxH === null || o > maxH)) maxH = o; }
  const newRows = R.filter(r => dateOrd(getV(r, 7)) === maxH);
  const newIds = newRows.map(ids);
  const newName = newRows.length ? name(newRows[0]) : "";

  let maxIJ = null;
  for (const r of R){ const o = rowMaxOrd(r, [8, 9]); if (o !== null && (maxIJ === null || o > maxIJ)) maxIJ = o; }
  const rerunMaxRows = R.filter(r => rowMaxOrd(r, [8, 9]) === maxIJ);
  const rerunNames = rerunMaxRows.map(name);
  const rerunList = [];
  for (const r of R){
    for (const c of [8, 9]){
      const o = dateOrd(getV(r, c));
      if (o !== null) rerunList.push({ o: o, id: ids(r), n: name(r) });
    }
  }
  rerunList.sort((a, b) => b.o - a.o);
  const rerunTop3 = rerunList.slice(0, 3);
  const rerunIds = rerunTop3.map(x => x.id);

  let maxKQ = null;
  for (const r of R){ const o = rowMaxOrd(r, [10, 11, 12, 13, 14]); if (o !== null && (maxKQ === null || o > maxKQ)) maxKQ = o; }
  const starRows = R.filter(r => rowMaxOrd(r, [10, 11, 12, 13, 14]) === maxKQ);
  const starNames = starRows.map(name).join(" ");
  const starIds = starRows.map(ids);

  const pad6 = a => {
    const out = a.slice(0, 6);
    while (out.length < 6) out.push("");
    return out;
  };

  const overview = [
    { name: "新角色", latest: newName,          prev: "",                        upcoming: "",                ids: pad6(newIds) },
    { name: "新复刻", latest: rerunNames.join("、"), prev: rerunTop3[1] ? rerunTop3[1].n : "", upcoming: rerunTop3[2] ? rerunTop3[2].n : "", ids: pad6(rerunIds) },
    { name: "新星辰", latest: starNames,         prev: "",                        upcoming: "",                ids: pad6(starIds) },
    { name: "#1",     latest: newIds.join(" "),  prev: "",                        upcoming: "新池-" + (maxH !== null ? fmtMd(maxH) : ""),     ids: pad6(newIds) },
    { name: "#2",     latest: rerunIds.join(" "), prev: "",                       upcoming: "新池-" + (maxIJ !== null ? fmtMd(maxIJ) : ""),    ids: pad6(rerunIds) },
    { name: "#3",     latest: starIds.join(" "), prev: "",                        upcoming: "新池-" + (maxKQ !== null ? fmtMd(maxKQ) : ""),    ids: pad6(starIds) }
  ];

  const elements = ELEMENTS.map((el, i) => {
    const anchor = R[i];
    const B = getV(anchor, 1);
    const C = getV(anchor, 2);
    const wait = (C !== null && C !== undefined)
      ? (Math.floor(Number(C) * 24) / 24).toFixed(2) + "天"
      : "";
    const attrRows = R
      .filter(r => getV(r, 5) === el.attr && dateOrd(getV(r, 7)) !== null)
      .sort((a, b) => dateOrd(getV(b, 7)) - dateOrd(getV(a, 7)));
    return {
      name: el.name,
      attr: el.attr,
      count: String(B == null ? "" : B).trim() + "个",
      wait: wait,
      last: attrRows.length ? name(attrRows[0]) : "",
      ids: pad6(attrRows.slice(0, 6).map(ids))
    };
  });

  return { overview: overview, elements: elements };
}

// ---------- 巅峰使用率：动态率表（gid 1850986413）----------
function computeUsage(data){
  const cols = data.table ? data.table.cols : [];
  const rows = data.table ? data.table.rows : [];
  const todayLabel = cols[2] ? String(cols[2].label || "") : "";
  const prevLabel = cols[3] ? String(cols[3].label || "") : "";
  const list = [];
  for (const r of rows){
    const id = getV(r, 0);
    if (id === null || id === undefined) continue;
    const tv = getV(r, 2);
    const pv = getV(r, 3);
    list.push({
      id: String(id).trim(),
      tv: typeof tv === "number" ? tv : NaN,
      pv: typeof pv === "number" ? pv : NaN,
      tf: getF(r, 2) || (typeof tv === "number" ? (tv * 100).toFixed(2) + "%" : "—"),
      pf: getF(r, 3) || (typeof pv === "number" ? (pv * 100).toFixed(2) + "%" : "—")
    });
  }
  list.sort((a, b) => b.tv - a.tv);
  return { todayLabel: todayLabel, prevLabel: prevLabel, list: list.slice(0, USAGE_TOP) };
}

// ---------- 角色名映射（卡-0 A -> G/F）----------
function nameMapOf(cardRows){
  const map = {};
  for (let i = 3; i < 153; i++){
    const r = cardRows[i];
    const id = String(getV(r, 0) == null ? "" : getV(r, 0)).trim();
    const nm = String(getV(r, 6) || "").trim();
    if (id && nm) map[id] = nm;
  }
  return map;
}

// ---------- 渲染 ----------
function iconHtml(id, size){
  id = String(id || "").trim();
  const p = id ? id.padStart(6, "0") : "";
  if (!p) return '<span class="empty">—</span>';
  const cls = size === "sm" ? "ico sm" : "ico";
  return '<span class="' + cls + '"><img src="' + ICON_BASE + p + ICON_SUFFIX
       + '" alt="ID ' + id + '" loading="lazy" title="角色ID ' + id + '"'
       + ' onerror="imgFail(this)" data-id="' + id + '"></span>';
}
function imgFail(el){
  el.outerHTML = '<span class="icofallback" title="角色ID ' + el.dataset.id + '">' + el.dataset.id + '</span>';
}
function iconsCell(ids){
  return ids.map(id => '<td class="cell-ico">' + iconHtml(id) + '</td>').join("");
}
function esc(v){
  return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function renderOverview(ov){
  let body = "";
  for (const r of ov){
    body += "<tr>"
      + '<td class="cell-name">' + esc(r.name) + "</td>"
      + "<td>" + esc(r.latest) + "</td>"
      + "<td>" + esc(r.prev) + "</td>"
      + "<td>" + esc(r.upcoming) + "</td>"
      + iconsCell(r.ids)
      + "</tr>";
  }
  document.getElementById("tbl-overview").innerHTML =
    '<table><thead><tr><th>卡池</th><th>最新卡池</th><th>上个卡池</th><th>即将 或已过期~</th>'
    + '<th>图1</th><th>图2</th><th>图3</th><th>图4</th><th>图5</th><th>图6</th>'
    + "</tr></thead><tbody>" + body + "</tbody></table>";
}
function renderElements(el){
  let body = "";
  for (const r of el){
    const tagCls = ELEMENT_TAG[r.attr] || "";
    body += "<tr>"
      + '<td class="cell-name">' + esc(r.name) + ' <span class="tag ' + tagCls + '">' + esc(r.attr) + "</span></td>"
      + "<td>" + esc(r.count) + "</td>"
      + "<td>" + esc(r.wait) + "</td>"
      + "<td>" + esc(r.last) + "</td>"
      + iconsCell(r.ids)
      + "</tr>";
  }
  document.getElementById("tbl-elements").innerHTML =
    '<table><thead><tr><th>属性</th><th>限定数</th><th>等待天数</th><th>上个角色</th>'
    + '<th>-1</th><th>-2</th><th>-3</th><th>-4</th><th>-5</th><th>-6</th>'
    + "</tr></thead><tbody>" + body + "</tbody></table>";
}
function renderUsage(usage, names){
  const fmtLabel = l => {
    const m = /^(\d{2})(\d{2})(\d{2})/.exec(String(l || ""));
    return m ? "20" + m[1] + "-" + m[2] + "-" + m[3] : l;
  };
  document.getElementById("usage-note").textContent = "数据日期：" + fmtLabel(usage.todayLabel);
  let body = "";
  usage.list.forEach((u, i) => {
    const rank = i + 1;
    const rankCls = rank === 1 ? "top1" : rank === 2 ? "top2" : rank === 3 ? "top3" : "";
    const nm = names[u.id] || "";
    const diff = u.tv - u.pv;
    let trend;
    if (!isNaN(diff)){
      if (diff > 0.00005) trend = '<span class="up">▲ +' + (diff * 100).toFixed(2) + "%</span>";
      else if (diff < -0.00005) trend = '<span class="down">▼ ' + (diff * 100).toFixed(2) + "%</span>";
      else trend = '<span class="flat">— 0.00%</span>';
    } else {
      trend = '<span class="flat">—</span>';
    }
    body += "<tr>"
      + '<td class="rank ' + rankCls + '">' + rank + "</td>"
      + '<td class="cell-name">' + iconHtml(u.id, "sm") + " " + esc(nm || ("ID " + u.id)) + "</td>"
      + '<td class="usage-pct">' + esc(u.tf) + "</td>"
      + '<td class="usage-prev">' + esc(u.pf) + "</td>"
      + "<td>" + trend + "</td>"
      + "</tr>";
  });
  document.getElementById("tbl-usage").innerHTML =
    '<table><thead><tr><th>排名</th><th>角色</th><th>今日使用率</th><th>昨日使用率</th><th>变化</th>'
    + "</tr></thead><tbody>" + body + "</tbody></table>";
}

// ---------- 时间 ----------
function fmtNow(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function fmtClock(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,"0");
  return p(d.getHours()) + ":" + p(d.getMinutes());
}

// ---------- 缓存 ----------
function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || typeof obj.ts !== "number" || typeof obj.card0 !== "string" || typeof obj.usage !== "string") return null;
    return obj;
  }catch(e){ return null; }
}
function writeCache(card0, usage){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), card0: card0, usage: usage }));
  }catch(e){ /* 隐私模式等场景忽略 */ }
}
function setCacheBadge(text, cls){
  const el = document.getElementById("cache-time");
  el.textContent = text;
  el.className = "badge" + (cls ? " " + cls : "");
}

// ---------- 数据读取 ----------
async function fetchJson(url){
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  return await resp.text();
}
function validateCard0(text){
  const data = parseGvizJson(text);
  if (!data || !data.table || !Array.isArray(data.table.rows) || data.table.rows.length < 153) throw new Error("卡池表结构不符合预期");
  return data;
}
function validateUsage(text){
  const data = parseGvizJson(text);
  if (!data || !data.table || !Array.isArray(data.table.rows)) throw new Error("使用率表结构不符合预期");
  return data;
}
function applyAll(card0Text, usageText){
  const card0 = validateCard0(card0Text);
  const usage = validateUsage(usageText);
  const t = computeCardTables(card0.table.rows);
  renderOverview(t.overview);
  renderElements(t.elements);
  renderUsage(computeUsage(usage), nameMapOf(card0.table.rows));
}
function showLoading(){
  const html = '<div class="loading"><span class="spinner"></span><br>正在在线读取并计算…</div>';
  document.getElementById("tbl-overview").innerHTML = html;
  document.getElementById("tbl-elements").innerHTML = html;
  document.getElementById("tbl-usage").innerHTML = html;
}

async function load(force){
  // 1) 缓存命中
  if (!force){
    const cache = readCache();
    if (cache && (Date.now() - cache.ts) < CACHE_TTL){
      try{
        applyAll(cache.card0, cache.usage);
        const mins = Math.max(1, Math.round((Date.now() - cache.ts) / 60000));
        setCacheBadge("缓存：" + fmtClock(cache.ts) + " 读取，已用 " + mins + " 分钟", "cache-ok");
        document.getElementById("fetch-time").textContent = "页面读取：缓存（" + fmtClock(cache.ts) + "）";
        return;
      }catch(e){ /* 缓存损坏则重新在线读取 */ }
    }
  }

  // 2) 在线读取
  showLoading();
  let lastErr = null;
  for (let attempt = 1; attempt <= 4; attempt++){
    try{
      const card0Text = await fetchJson(CARD0_URL);
      const usageText = await fetchJson(USAGE_URL);
      applyAll(card0Text, usageText);
      writeCache(card0Text, usageText);
      setCacheBadge("缓存：刚刚在线读取", "cache-ok");
      document.getElementById("fetch-time").textContent = "页面读取：" + fmtNow();
      return;
    }catch(err){
      lastErr = err;
      if (attempt < 4){
        await new Promise(r => setTimeout(r, attempt * 1500));
      }
    }
  }

  // 3) 失败回退缓存
  const cache = readCache();
  if (cache){
    try{
      applyAll(cache.card0, cache.usage);
      setCacheBadge("在线读取失败，显示缓存（" + fmtClock(cache.ts) + "）", "cache-warn");
      document.getElementById("fetch-time").textContent = "页面读取：失败，用缓存（" + fmtNow() + "）";
      return;
    }catch(e){ /* 缓存也无法用，走报错 */ }
  }
  document.getElementById("tbl-usage").innerHTML =
    '<div class="error">❌ 在线读取失败：' + esc(lastErr ? lastErr.message : "未知错误")
    + '<br>已自动重试 4 次仍未成功。请确认：① 表格已开启“知道链接的任何人可查看”；② 页面需通过 http(s) 访问（如 GitHub Pages 或本地服务器），不能直接用 file:// 打开；③ 稍后再点“刷新数据”。</div>';
  document.getElementById("tbl-overview").innerHTML = "";
  document.getElementById("tbl-elements").innerHTML = "";
  setCacheBadge("缓存：无", "");
  document.getElementById("fetch-time").textContent = "页面读取：失败（" + fmtNow() + "）";
}

document.getElementById("fetch-time").textContent = "页面读取：" + fmtNow();
load(false);
setInterval(load, 60 * 60 * 1000);
</script>
