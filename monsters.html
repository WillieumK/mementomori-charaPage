<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推图推关 · 怪物数值查询</title>
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#0d0b14;
  --panel:rgba(255,255,255,.045);
  --panel-border:rgba(255,255,255,.09);
  --gold:#d9b26a;
  --accent:#7c6cf0;
  --text:#e8e6f0;
  --muted:#9a94ad;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(124,108,240,.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(217,178,106,.10), transparent 60%),
    linear-gradient(180deg,#0d0b14 0%,#12101c 55%,#0a0910 100%);
  background-attachment:fixed;
}
.wrap{max-width:1200px;margin:0 auto;padding:36px 20px 60px}
header.top{text-align:center;padding:34px 20px 24px;border-bottom:1px solid var(--panel-border);margin-bottom:26px}
header.top h1{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 10px;font-size:30px;letter-spacing:1px}
h1 .logo{width:42px;height:42px;border-radius:10px;box-shadow:0 0 18px rgba(217,178,106,.35)}
h1 .title-grad{background:linear-gradient(90deg,#f5e6c4,#d9b26a 45%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .subtitle{margin:0 0 12px;color:var(--muted);font-size:14px}
.badge{display:inline-block;padding:5px 12px;border:1px solid rgba(217,178,106,.4);border-radius:999px;color:var(--gold);font-size:12px;background:rgba(217,178,106,.08);margin:3px}
.badge.cache-ok{color:#9be8b2;border-color:rgba(155,232,178,.4);background:rgba(155,232,178,.08)}
.toolbar{display:flex;justify-content:flex-end;gap:10px;margin:0 0 14px}
.toolbar button,button.mini{background:linear-gradient(90deg,#7c6cf0,#5b4fd6);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:filter .2s,transform .1s}
.toolbar button:hover,button.mini:hover{filter:brightness(1.12)}
button.mini{padding:6px 14px;font-size:12px}
section.card{background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:20px 22px 24px;margin:0 0 24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
section.card h2{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:18px;color:#f1eef8}
section.card h2::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--accent))}
.h2-note{color:var(--muted);font-size:12px;font-weight:400;margin-left:auto}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:rgba(255,255,255,.05);border:1px solid var(--panel-border);color:var(--text);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer}
.tabs button.active{background:linear-gradient(90deg,#7c6cf0,#5b4fd6);color:#fff;border-color:transparent;font-weight:600}
.qrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.qrow label{color:var(--muted);font-size:13px}
.qrow select,.qrow input{background:#1c1730;color:var(--gold);border:1px solid rgba(217,178,106,.35);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
.qrow .num-inp{width:64px;padding:7px 8px}
.qrow .chk{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;cursor:pointer}
.qrow .lbl-manual{color:var(--muted);font-size:13px}
.sres{border:1px solid var(--panel-border);border-radius:10px;margin:10px 0;background:rgba(0,0,0,.18);overflow:hidden}
.sres-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--panel-border);background:#1c1730}
.sres-stage{font-weight:700;color:var(--gold)}
.sres-n{color:var(--muted);font-size:12px}
.sres-head .mini{margin-left:auto}
.sres-full{display:none}
.qrow input[type=text]{width:180px}
.table-wrap{overflow-x:auto;border:1px solid var(--panel-border);border-radius:10px;background:rgba(0,0,0,.18)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#1c1730;color:var(--gold);font-weight:600;text-align:left;white-space:nowrap;padding:9px 12px;border-bottom:1px solid rgba(217,178,106,.25)}
tbody td{padding:8px 12px;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
tbody tr:hover{background:rgba(124,108,240,.14)}
tbody tr:last-child td{border-bottom:none}
.mname{font-weight:600;color:#f1eef8}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--panel-border)}
.tag.light{color:#ffe9a8;border-color:rgba(255,233,168,.45);background:rgba(255,233,168,.08)}
.tag.dark{color:#c9b8ff;border-color:rgba(201,184,255,.45);background:rgba(201,184,255,.08)}
.tag.blue{color:#9ecfff;border-color:rgba(158,207,255,.45);background:rgba(158,207,255,.08)}
.tag.red{color:#ffb4a8;border-color:rgba(255,180,168,.45);background:rgba(255,180,168,.08)}
.tag.green{color:#b5f0c3;border-color:rgba(181,240,195,.45);background:rgba(181,240,195,.08)}
.tag.yellow{color:#ffe9a8;border-color:rgba(255,233,168,.45);background:rgba(255,233,168,.08)}
.eicons{display:flex;flex-wrap:wrap;gap:10px;padding:10px 12px;border-bottom:1px solid var(--panel-border)}
.eicon img{width:72px;height:72px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--panel-border);object-fit:cover}
.loading,.error{color:var(--muted);padding:30px;text-align:center}
.error{color:#ff9d9d}
.spinner{display:inline-block;width:26px;height:26px;margin-bottom:10px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;line-height:1.9}
footer a{color:#a99fd9}
/* ===== 左侧悬浮标题列 ===== */
.side{position:fixed;left:0;top:0;bottom:0;width:345px;background:rgba(16,13,26,.97);border-right:1px solid var(--panel-border);padding:22px 14px;z-index:80;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto}
.side.open{transform:translateX(0)}
.side .side-title{color:var(--gold);font-weight:700;font-size:19px;margin:0 0 16px;padding:0 6px;letter-spacing:1px}
.side .side-title .cyl{display:inline-block;width:18px;height:18px;background:var(--gold);-webkit-mask:url("cyl.png") center/contain no-repeat;mask:url("cyl.png") center/contain no-repeat;vertical-align:-3px;margin-right:6px}

.side .side-link{display:block;color:var(--text);text-decoration:none;padding:14px 16px;border-radius:10px;margin-bottom:8px;font-size:17px;line-height:1.4}
.side .side-link:hover{background:rgba(124,108,240,.18)}
.side .side-link.active{background:linear-gradient(90deg,#7c6cf0,#5b4fd6);color:#fff;font-weight:600}
.side .side-link .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.side-open{position:fixed;left:10px;top:10px;z-index:90;width:40px;height:40px;border-radius:10px;border:1px solid var(--panel-border);background:rgba(20,17,32,.9);color:var(--gold);font-size:18px;cursor:pointer;display:block}
body:not(.side-collapsed) .side-open{left:calc(345px - 52px)}
.side-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none}
.side-mask.show{display:block}
@media (min-width:769px){
  body:not(.side-collapsed){padding-left:345px}
}
@media (max-width:768px){
  header.top{padding-top:52px}
  .wrap{padding:16px 10px 40px}
  header.top h1{font-size:22px;flex-wrap:wrap}
  h1 .logo{width:32px;height:32px}
  section.card{padding:14px 12px 18px;margin-bottom:16px}
  section.card h2{font-size:15px}
  thead th,tbody td{padding:7px 8px;font-size:12px}
  .qrow input[type=text]{width:120px}
  .eicon img{width:56px;height:56px}
}
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:16px}
</style>
</head>
<body>
<div class="side-mask" id="side-mask" onclick="toggleSide(false)"></div>
<nav class="side" id="side">
  <div class="side-title"><span class="cyl"></span>MementoMori 数据</div>
  <a class="side-link" href="index.html#sec-usage">巅峰使用率<span class="sub">18%+ / 13%+ / 3%+ 分组</span></a>
  <a class="side-link" href="index.html#sec-overview">当期卡池记录<span class="sub">新角色 · 新复刻 · 新星辰</span></a>
  <a class="side-link" href="index.html#sec-elements">属性轮档记录<span class="sub">天光 · 幽冥 · 忧蓝 · 业红 · 苍翠 · 流金</span></a>
  <a class="side-link active" href="monsters.html">怪物数值查询<span class="sub">主线 Quest / 塔 Tower</span></a>
</nav>
<button class="side-open" id="side-open" onclick="toggleSide()">☰</button>

<div class="wrap">
  <header class="top">
    <h1><img class="logo" src="icon.png" alt="icon"><span class="title-grad">推图推关 · 怪物数值查询</span></h1>
    <p class="subtitle">主线 Quest / 塔 Tower · 怪物数值查询</p>
    <p>
      <span class="badge"><span class="dot"></span>数据访问：GitHub（需配置网络环境）</span>
      <span class="badge" id="data-date">数据日期：—</span>
      <span class="badge" id="device">💻 desktop 端</span>
    </p>
  </header>

  <div class="toolbar">
    <button id="btn-refresh" onclick="loadData(true)">🔄 刷新数据</button>
  </div>

  <section class="card">
    <h2>查询条件</h2>
    <div class="tabs">
      <button id="tab-quest" class="active" onclick="setMode('quest')">主线 Quest</button>
      <button id="tab-tower" onclick="setMode('tower')">塔 Tower</button>
    </div>
    <div class="qrow" id="q-quest" style="display:flex;flex-wrap:wrap">
      <label>章节</label>
      <select id="sel-chapter" onchange="onChapterChange()"></select>
      <label>关卡</label>
      <select id="sel-stage" onchange="onQueryChange()"></select>
      <label class="lbl-manual">填写关卡模式</label>
      <input id="inp-stage-manual" class="num-inp" style="width:110px" placeholder="如 39-23" onchange="onQueryChange()">
    </div>
    <div class="qrow" id="q-tower" style="display:none;flex-wrap:wrap">
      <label>塔</label><select id="sel-tower" onchange="onTowerChange()"></select>
      <label>层数</label>
      <select id="sel-level" onchange="onQueryChange()"></select>
      <label class="lbl-manual">填写关卡模式</label>
      <input id="inp-level-manual" class="num-inp" style="width:90px" placeholder="如 500" onchange="onQueryChange()">
    </div>
    <div class="qrow" style="margin-top:12px;flex-wrap:wrap">
      <label class="chk"><input type="checkbox" id="chk-all" onchange="doSearch()"> 搜索全部章节</label>
      <label>条件1</label><input type="text" id="inp-m1" class="num-inp" style="width:120px" placeholder="怪物名" onchange="doSearch()">
      <label>条件2</label><input type="text" id="inp-m2" class="num-inp" style="width:120px" placeholder="怪物名" onchange="doSearch()">
      <label>条件3</label><input type="text" id="inp-m3" class="num-inp" style="width:120px" placeholder="怪物名" onchange="doSearch()">
    </div>
  </section>

  <section class="card">
    <h2>怪物数值<span class="h2-note" id="res-note"></span></h2>
    <div class="table-wrap" id="tbl-res"></div>
  </section>

  <footer>
    原始数据来自 <a href="https://mentemori.icu/" target="_blank" rel="noopener">mentemori.icu</a> · 网页数据存于 <a href="https://github.com/WillieumK/mementomori-charaPage" target="_blank" rel="noopener">GitHub</a> · 表格数据 Google Sheets（<a href="https://docs.google.com/spreadsheets/d/1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA" target="_blank" rel="noopener">quest</a> / <a href="https://docs.google.com/spreadsheets/d/1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA" target="_blank" rel="noopener">tower</a>）
  </footer>
</div>

<script>
"use strict";
const CARD_SHEET_ID = "1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA";
const DATA_QUEST = "data/quest.json";
const DATA_TOWER = "data/tower.json";
const COLS = ["stage", "name", "attr", "rarity", "rank", "speed", "reson", "atk", "def", "hp", "mdef", "pdef", "skill", "stamina", "magic", "strength"];
const ELEMENT_TAG = { "光":"light", "暗":"dark", "蓝":"blue", "红":"red", "绿":"green", "黄":"yellow", "翠":"green" };
const TOWERS = [
  { prefix: "無", label: "无穷塔" },
  { prefix: "藍", label: "蓝塔" },
  { prefix: "紅", label: "红塔" },
  { prefix: "黄", label: "黄塔" },
  { prefix: "翠", label: "绿塔" }
];

let questData = null, towerData = null;
let mode = "quest";

function parseGvizJson(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  return JSON.parse(text.slice(start, end + 1));
}
function cellVal(r, i){
  try{
    const c = r && r.c ? r.c : null;
    if (!c || i >= c.length) return null;
    const cell = c[i];
    return cell ? (cell.f !== undefined ? cell.f : cell.v) : null;
  }catch(e){ return null; }
}
function iconRarity(r){
  const s = String(r || "").toLowerCase();
  const m = /^lr\+(\d*)$/.exec(s);
  if (m) return "lr" + (m[1] || "1");
  return s.replace(/\+/g, "plus");
}
function esc(v){
  return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function loadCompact(url){
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("数据缓存未就绪(" + resp.status + ")，请点击刷新或稍后再试");
  const d = await resp.json();
  if (!d || !Array.isArray(d.rows)) throw new Error("数据格式错误");
  return d;
}

function fmtDate(d){
  const s = String(d || "").replace(/\.\d+$/, "");
  const m = /^(\d{2})(\d{2})(\d{2})$/.exec(s);
  return m ? "20" + m[1] + "-" + m[2] + "-" + m[3] : (s || "—");
}

async function loadData(force){
  const el = document.getElementById("tbl-res");
  el.innerHTML = '<div class="loading"><span class="spinner"></span><br>正在读取怪物数据…</div>';
  try{
    if (!questData || force) questData = await loadCompact(DATA_QUEST);
    if (!towerData || force) towerData = await loadCompact(DATA_TOWER);
    document.getElementById("data-date").textContent = "数据源：masterbook（在线）";
    buildQuestSelects();
    buildTowerSelects();
    onQueryChange();
  }catch(err){
    el.innerHTML = '<div class="error">❌ 读取失败：' + esc(err.message) + '<br>请稍后再试，或点击“刷新数据”。</div>';
  }
}

function buildQuestSelects(){
  const set = new Set();
  for (const r of questData.rows){
    const m = /^(\d+)-(\d+)$/.exec(String(r[0] || ""));
    if (m) set.add(parseInt(m[1], 10));
  }
  const chapters = [...set].sort((a, b) => a - b);
  const selC = document.getElementById("sel-chapter");
  selC.innerHTML = chapters.map(c => '<option value="' + c + '">第 ' + c + ' 章</option>').join("");
  selC.value = chapters.length ? String(chapters[0]) : "";
  onChapterChange();
}
function onChapterChange(){
  const ch = parseInt(document.getElementById("sel-chapter").value, 10);
  if (isNaN(ch)) { onQueryChange(); return; }
  const set = new Set();
  for (const r of questData.rows){
    const m = /^(\d+)-(\d+)$/.exec(String(r[0] || ""));
    if (m && parseInt(m[1], 10) === ch) set.add(m[0]);
  }
  const stages = [...set].sort();
  const selS = document.getElementById("sel-stage");
  selS.innerHTML = stages.map(s => '<option value="' + s + '">' + s + '</option>').join("");
  selS.value = stages.length ? stages[0] : "";
  onQueryChange();
}
function buildTowerSelects(){
  const sel = document.getElementById("sel-tower");
  sel.innerHTML = TOWERS.map((t, i) => '<option value="' + i + '">' + t.label + '</option>').join("");
  onTowerChange();
}
function onTowerChange(){
  const ti = parseInt(document.getElementById("sel-tower").value, 10);
  const t = TOWERS[ti];
  const set = new Set();
  for (const r of towerData.rows){
    const m = /^(.+?)(\d+)$/.exec(String(r[0] || ""));
    if (m && m[1] === t.prefix) set.add(parseInt(m[2], 10));
  }
  const levels = [...set].sort((a, b) => a - b);
  const selL = document.getElementById("sel-level");
  selL.innerHTML = levels.map(l => '<option value="' + l + '">' + l + '</option>').join("");
  selL.value = levels.length ? String(levels[0]) : "";
  onQueryChange();
}
function setMode(m){
  mode = m;
  document.getElementById("tab-quest").classList.toggle("active", m === "quest");
  document.getElementById("tab-tower").classList.toggle("active", m === "tower");
  document.getElementById("q-quest").style.display = m === "quest" ? "flex" : "none";
  document.getElementById("q-tower").style.display = m === "tower" ? "flex" : "none";
  onQueryChange();
}
function currentStageStr(){
  if (mode === "quest"){
    const m = document.getElementById("inp-stage-manual").value.trim();
    if (m) return m;
    return document.getElementById("sel-stage").value;
  }
  const ti = parseInt(document.getElementById("sel-tower").value, 10);
  const prefix = TOWERS[ti].prefix;
  const m = document.getElementById("inp-level-manual").value.trim();
  if (m) return prefix + m;
  return prefix + document.getElementById("sel-level").value;
}
function onQueryChange(){
  const el = document.getElementById("tbl-res");
  if (activeConds().length){ doSearch(); return; }
  if (mode === "quest" && questData){
    const stage = currentStageStr();
    renderRows(questData, r => String(r[0]) === stage, "关卡 " + stage);
  } else if (mode === "tower" && towerData){
    const st = currentStageStr();
    const num = st.replace(/^.+?(\d+)$/, "$1");
    renderRows(towerData, r => String(r[0]) === st, num + " 层");
  }
}
function rowTableHtml(rows){
  let body = "";
  for (const r of rows){
    const stageShow = mode === "tower" ? String(r[0]).replace(/^.+?(\d+)$/, "$1") : String(r[0]);
    body += "<tr>"
      + "<td>" + esc(stageShow) + "</td>"
      + '<td class="mname">' + esc(r[1]) + "</td>"
      + "<td>" + esc(r[5]) + "</td>"
      + "<td>" + esc(r[6]) + "</td>"
      + "<td>" + esc(r[7]) + "</td>"
      + "<td>" + esc(r[8]) + "</td>"
      + "<td>" + esc(r[9]) + "</td>"
      + "<td>" + esc(r[10]) + "</td>"
      + "<td>" + esc(r[11]) + "</td>"
      + "<td>" + esc(r[12]) + "</td>"
      + "<td>" + esc(r[13]) + "</td>"
      + "<td>" + esc(r[14]) + "</td>"
      + "<td>" + esc(r[15]) + "</td>"
      + "</tr>";
  }
  return '<table><thead><tr><th>关卡</th><th>怪物名</th><th>速度</th><th>共鸣</th><th>攻击</th><th>防御</th><th>血量</th><th>魔防</th><th>物防</th><th>战技</th><th>耐力</th><th>魔力</th><th>力量</th></tr></thead><tbody>'
    + (body || '<tr><td colspan="13" style="color:var(--muted)">无匹配怪物</td></tr>')
    + "</tbody></table>";
}
function stageIconsHtml(rows){
  let icons = "";
  for (const r of rows){
    const icon = String(r[16] || "").trim();
    if (!icon) continue;
    const rarity = iconRarity(r[3]);
    const level = String(r[4] || "");
    const type = (r[17] !== undefined && r[17] !== null) ? Number(r[17]) : ((parseInt(icon, 10) || 0) < 10000 ? 0 : 1);
    const src = "https://api.tamamo.dev/Generate/Character?icon=" + encodeURIComponent(icon)
      + "&rarity=" + encodeURIComponent(rarity) + "&level=" + encodeURIComponent(level)
      + "&link=0&type=" + type;
    icons += '<span class="eicon" title="' + esc(r[1]) + " (" + esc(r[3]) + " Lv" + esc(level) + ')"><img src="' + src + '" loading="lazy" alt="' + esc(r[1]) + '"></span>';
  }
  return icons ? '<div class="eicons">' + icons + "</div>" : "";
}
function stageContentHtml(rows){
  return stageIconsHtml(rows) + rowTableHtml(rows);
}
function renderRows(data, filter, note){
  const el = document.getElementById("tbl-res");
  const rows = data.rows.filter(filter);
  document.getElementById("res-note").textContent = note + " · 共 " + rows.length + " 只怪物";
  el.innerHTML = stageContentHtml(rows);
}
function activeConds(){
  return ["inp-m1", "inp-m2", "inp-m3"].map(id => document.getElementById(id).value.trim()).filter(Boolean);
}
function doSearch(){
  const conds = activeConds();
  if (!conds.length){ onQueryChange(); return; }
  const data = mode === "quest" ? questData : towerData;
  if (!data) return;
  const all = document.getElementById("chk-all").checked;
  const pool = all ? data.rows : data.rows.filter(r => String(r[0]) === currentStageStr());
  const map = {};
  for (const r of pool){ const s = String(r[0]); (map[s] = map[s] || []).push(r); }
  const lower = conds.map(c => c.toLowerCase());
  const results = Object.keys(map)
    .map(s => ({ stage: s, rows: map[s], hit: conds.filter((c, i) => map[s].some(r => String(r[1]).toLowerCase().indexOf(lower[i]) >= 0)) }))
    .filter(x => x.hit.length === conds.length)
    .sort((a, b) => a.stage.localeCompare(b.stage, undefined, { numeric: true }));
  renderSearch(results, conds, all);
}
function renderSearch(results, conds, all){
  const el = document.getElementById("tbl-res");
  document.getElementById("res-note").textContent = "搜索：“" + conds.join("、") + "” · " + (all ? "全部章节" : "当前关卡") + " · 命中 " + results.length + " 个关卡";
  let html = "";
  for (const rs of results){
    const full = '<div class="sres-full">' + stageContentHtml(rs.rows) + '</div>';
    if (conds.length === 1){
      const c = conds[0].toLowerCase();
      const matched = rs.rows.filter(r => String(r[1]).toLowerCase().indexOf(c) >= 0);
      html += '<div class="sres">'
        + '<div class="sres-head"><span class="sres-stage">' + esc(rs.stage) + '</span>'
        + '<span class="sres-n">命中 ' + matched.length + ' 只</span>'
        + '<button class="mini" onclick="toggleSres(this)">展开本关全部敌人</button></div>'
        + rowTableHtml(matched)
        + full
        + '</div>';
    } else {
      html += '<div class="sres">'
        + '<div class="sres-head"><span class="sres-stage">' + esc(rs.stage) + '</span>'
        + '<span class="sres-n">含 ' + conds.length + ' 个条件</span>'
        + '<button class="mini" onclick="toggleSres(this)">展开本关敌人</button></div>'
        + full
        + '</div>';
    }
  }
  el.innerHTML = html || '<div class="error">未找到满足条件的关卡</div>';
}
function toggleSres(btn){
  const wrap = btn.closest(".sres");
  const full = wrap.querySelector(".sres-full");
  const open = full.style.display !== "none";
  full.style.display = open ? "none" : "block";
  btn.textContent = open ? "展开本关敌人" : "收起";
}
function toggleSide(force){
  const s = document.getElementById("side");
  const m = document.getElementById("side-mask");
  const open = typeof force === "boolean" ? force : !s.classList.contains("open");
  s.classList.toggle("open", open);
  if (m){
    const isM = window.matchMedia("(max-width: 768px)").matches;
    m.classList.toggle("show", open && isM);
  }
  document.body.classList.toggle("side-collapsed", !open);
}
function detectDevice(){
  const mq = window.matchMedia("(max-width: 768px)");
  const el = document.getElementById("device");
  const apply = () => {
    const isM = mq.matches;
    document.documentElement.classList.toggle("mobile", isM);
    if (el) el.textContent = isM ? "📱 移动端" : "💻 desktop 端";
  };
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);
}

detectDevice();
toggleSide(window.matchMedia("(min-width: 769px)").matches);
loadData(false);
</script>
