name: 更新数据并部署
on:
  schedule:
    # 北京时间 4 / 10 / 16 / 22 点 = UTC 20 / 02 / 08 / 14 点
    - cron: '0 20,2,8,14 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 Google Sheets 数据（卡-0 + 动态率）
        run: |
          mkdir -p data
          curl -fsSL "https://docs.google.com/spreadsheets/d/1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA/gviz/tq?gid=157463114&tqx=out:json" -o data/card0.json
          curl -fsSL "https://docs.google.com/spreadsheets/d/1VrnhPswVqPPbbC-Gps_e9Um7tWulYg4BI66HMt_OBZw/gviz/tq?gid=1850986413&tqx=out:json" -o data/usage.json
          ls -la data

      - name: 抓取并压缩 quest / tower 数据
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, time
          SID = "1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA"
          IDX = [3, 4, 5, 7, 8, 9, 10, 11, 12, 13]
          COLS = ["name", "attr", "stage", "reson", "note", "atk", "def", "hp", "mdef", "pdef"]
          def cv(r, i):
              try:
                  c = r.get("c") if isinstance(r, dict) else None
                  if not c or i >= len(c): return None
                  cell = c[i]
                  return cell.get("f", cell.get("v")) if isinstance(cell, dict) else None
              except Exception:
                  return None
          for fn, gid in [("quest.json", "1602712043"), ("tower.json", "698292977")]:
              url = "https://docs.google.com/spreadsheets/d/%s/gviz/tq?gid=%s&tqx=out:json&x=%d" % (SID, gid, int(time.time()))
              t = urllib.request.urlopen(url, timeout=240).read().decode("utf-8")
              d = json.loads(t[t.index("{"):t.rindex("}")+1])
              rows = d["table"]["rows"]
              date = str(cv(rows[0], 0) or "")
              out = {"date": date, "cols": COLS, "rows": [[cv(r, i) for i in IDX] for r in rows[1:]]}
              with open("data/" + fn, "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          PYEOF
          ls -la data

      - name: 提交数据更新到 main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "数据缓存更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
