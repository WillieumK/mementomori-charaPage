name: 更新数据并部署
on:
  schedule:
    # 北京时间 4 / 10 / 16 / 22 点 = UTC 20 / 02 / 08 / 14 点
    - cron: '0 20,2,8,14 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 Google Sheets 数据（卡-0 + 动态率）
        run: |
          mkdir -p data
          curl -fsSL "https://docs.google.com/spreadsheets/d/1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA/gviz/tq?gid=157463114&tqx=out:json" -o data/card0.json
          curl -fsSL "https://docs.google.com/spreadsheets/d/1VrnhPswVqPPbbC-Gps_e9Um7tWulYg4BI66HMt_OBZw/gviz/tq?gid=1850986413&tqx=out:json" -o data/usage.json
          ls -la data

      - name: 抓取并压缩 masterbook 怪物数据（在线 JSON）
        run: |
          python3 - <<'PYEOF'
          import json, re, urllib.request, collections
          BOSS = "https://raw.githubusercontent.com/nnsh774/mememori-masterbook/refs/heads/master/BossBattleEnemyMB.json"
          TOWER = "https://raw.githubusercontent.com/nnsh774/mememori-masterbook/refs/heads/master/TowerBattleEnemyMB.json"
          TEXT = "https://raw.githubusercontent.com/nnsh774/mememori-masterbook/refs/heads/master/TextResourceZhCnMB.json"
          COLS = ["stage","name","attr","rarity","rank","speed","reson","atk","def","hp","mdef","pdef","skill","stamina","magic","strength","icon","type"]
          ELEM = {1:"\u84dd",2:"\u7ea2",3:"\u7eff",4:"\u9ec4",5:"\u5149",6:"\u6697"}
          RAR = {0:"\u65e0",1:"N",2:"R",4:"R+",8:"SR",16:"SR+",32:"SSR",64:"SSR+",128:"UR",256:"UR+",512:"LR",1024:"LR+",2048:"LR+2",4096:"LR+3",8192:"LR+4",16384:"LR+5",32768:"LR+6",65536:"LR+7",131072:"LR+8",262144:"LR+9",524288:"LR+10"}
          WAN="\u4e07"; YI="\u4ebf"; GAO="\u9ad8"; DI="\u4f4e"
          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              return json.loads(urllib.request.urlopen(req, timeout=300).read().decode("utf-8"))
          def fmt(v):
              if v is None or v == "" or v == 0: return ""
              val = float(v)
              if val >= 1e8: return "%.4g%s" % (val/1e8, YI)
              if val >= 1e4: return "%.4g%s" % (val/1e4, WAN)
              return str(int(val))
          def process(items, is_tower):
              rows = []
              for it in items:
                  b = it.get("BattleParameter") or {}
                  base = it.get("BaseParameter") or {}
                  memo = str(it.get("Memo","")).replace('"',"").strip()
                  if is_tower:
                      stage = memo.split("_")[0] if "_" in memo else memo
                  else:
                      m = re.match(r"St(\d+)_", memo)
                      if m: stage = "1-"+m.group(1)
                      else:
                          m2 = re.match(r"(\d+-\d+)_", memo)
                          stage = m2.group(1) if m2 else ""
                  et = it.get("ElementType")
                  rows.append({"stage":stage,"name":it.get("_name",""),"attr":ELEM.get(et,("\u65e0" if et in (0,None) else str(et))),"rarity":RAR.get(it.get("CharacterRarityFlags"),str(it.get("CharacterRarityFlags"))),"rank":it.get("EnemyRank"),"speed":b.get("Speed"),"reson":"","atk":b.get("AttackPower"),"def":b.get("Defense"),"hp":b.get("HP"),"mdef":b.get("MagicDamageRelax"),"pdef":b.get("PhysicalDamageRelax"),"skill":base.get("Energy"),"stamina":base.get("Health"),"magic":base.get("Intelligence"),"strength":base.get("Muscle"),"icon":it.get("UnitIconId"),"type":(1 if "EnemyCharacterName" in str(it.get("NameKey","")) else 0)})
              groups = collections.defaultdict(list)
              for i,r in enumerate(rows):
                  if r["stage"]: groups[r["stage"]].append(i)
              for g in groups.values():
                  valid = [i for i in g if rows[i]["def"] not in (None,"")]
                  if len(valid) >= 2:
                      rows[max(valid,key=lambda i: float(rows[i]["def"]))]["reson"] = GAO
                      rows[min(valid,key=lambda i: float(rows[i]["def"]))]["reson"] = DI
              for c in ["atk","def","hp","mdef","pdef","skill","stamina","magic","strength"]:
                  for r in rows: r[c] = fmt(r[c])
              return rows
          text = fetch(TEXT)
          nm = {i["StringKey"]: i["Text"] for i in text if "StringKey" in i and "Text" in i}
          boss = fetch(BOSS); tw = fetch(TOWER)
          for it in boss: it["_name"] = nm.get(it.get("NameKey",""),"")
          for it in tw: it["_name"] = nm.get(it.get("NameKey",""),"")
          for fn, items, is_t in [("quest.json", boss, False), ("tower.json", tw, True)]:
              rows = process(items, is_t)
              d = json.dumps({"date":"masterbook","cols":COLS,"rows":[[r[c] for c in COLS] for r in rows]}, ensure_ascii=False, separators=(",",":"))
              with open("data/"+fn, "w", encoding="utf-8") as f:
                  f.write(d)
              print(fn, len(rows))
          PYEOF
          ls -la data

      - name: 提交数据更新到 main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "数据缓存更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
