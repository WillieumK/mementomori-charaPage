name: 更新数据并部署
on:
  schedule:
    # 北京时间 4 / 10 / 16 / 22 点 = UTC 20 / 02 / 08 / 14 点
    - cron: '0 20,2,8,14 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 Google Sheets 数据（卡-0 + 动态率）
        run: |
          mkdir -p data
          curl -fsSL "https://docs.google.com/spreadsheets/d/1zfViKEEZCk1fdozmX_i1Udtc115QxeWP3lzaf3vrvYA/gviz/tq?gid=157463114&tqx=out:json" -o data/card0.json
          curl -fsSL "https://docs.google.com/spreadsheets/d/1VrnhPswVqPPbbC-Gps_e9Um7tWulYg4BI66HMt_OBZw/gviz/tq?gid=1850986413&tqx=out:json" -o data/usage.json
          ls -la data

      - name: 抓取并压缩 怪物数据（官方 boi CDN）
        run: |
          pip install msgpack -q
          python3 - <<'PYEOF'
          import json, re, urllib.request, collections, msgpack
          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=600).read()
          for ver in ["4.19.2", "4.19.0", "4.18.0"]:
              try:
                  h = {"OrtegaDeviceType":"4","ortegaappversion":ver,"Content-Type":"application/octet-stream"}
                  r = urllib.request.Request("https://prd1-auth.mememori-boi.com/api/auth/getDataUri", data=msgpack.packb({"CountryCode":"JP","UserId":0}), headers=h, method="POST")
                  mver = dict(urllib.request.urlopen(r, timeout=30).headers)["ortegamasterversion"]
                  break
              except Exception:
                  continue
          else:
              raise RuntimeError("getDataUri failed")
          base = "https://cdn-mememori.akamaized.net/master/prd1/version/%s/" % mver
          def load_mb(n): return msgpack.unpackb(fetch(base + n))
          COLS = ["stage","name","attr","rarity","rank","speed","reson","atk","def","hp","mdef","pdef","skill","stamina","magic","strength","icon","type"]
          ELEM = {1:"\u84dd",2:"\u7ea2",3:"\u7eff",4:"\u9ec4",5:"\u5149",6:"\u6697","Blue":"\u84dd","Red":"\u7ea2","Green":"\u7eff","Yellow":"\u9ec4","Light":"\u5149","Dark":"\u6697"}
          RAR = {0:"\u65e0",1:"N",2:"R",4:"R+",8:"SR",16:"SR+",32:"SSR",64:"SSR+",128:"UR",256:"UR+",512:"LR",1024:"LR+",2048:"LR+2",4096:"LR+3",8192:"LR+4",16384:"LR+5",32768:"LR+6",65536:"LR+7",131072:"LR+8",262144:"LR+9",524288:"LR+10"}
          WAN="\u4e07"; YI="\u4ebf"; GAO="\u9ad8"; DI="\u4f4e"
          def fmt(v):
              # 缓存存原始数值（不带万/亿），显示时再转换
              if v is None or v == "" or v == 0: return ""
              return int(v)
          def process(items, is_tower):
              rows = []
              for it in items:
                  b = it.get("BattleParameter") or {}
                  basep = it.get("BaseParameter") or {}
                  memo = str(it.get("Memo","")).replace('"',"").strip()
                  if is_tower:
                      stage = memo.split("_")[0] if "_" in memo else memo
                  else:
                      m = re.match(r"St(\d+)_", memo)
                      if m: stage = "1-"+m.group(1)
                      else:
                          m2 = re.match(r"(\d+-\d+)_", memo)
                          stage = m2.group(1) if m2 else ""
                  et = it.get("ElementType")
                  rows.append({"stage":stage,"name":it.get("_name",""),"attr":ELEM.get(et,("\u65e0" if et in (0,None) else str(et))),"rarity":RAR.get(it.get("CharacterRarityFlags"),str(it.get("CharacterRarityFlags"))),"rank":it.get("EnemyRank"),"speed":b.get("Speed"),"reson":"","atk":b.get("AttackPower"),"def":b.get("Defense"),"hp":b.get("HP"),"mdef":b.get("MagicDamageRelax"),"pdef":b.get("PhysicalDamageRelax"),"skill":basep.get("Energy"),"stamina":basep.get("Health"),"magic":basep.get("Intelligence"),"strength":basep.get("Muscle"),"icon":it.get("UnitIconId"),"type":(1 if "EnemyCharacterName" in str(it.get("NameKey","")) else 0)})
              groups = collections.defaultdict(list)
              for i,r in enumerate(rows):
                  if r["stage"]: groups[r["stage"]].append(i)
              for g in groups.values():
                  valid = [i for i in g if rows[i]["def"] not in (None,"")]
                  if len(valid) >= 2:
                      rows[max(valid,key=lambda i: float(rows[i]["def"]))]["reson"] = GAO
                      rows[min(valid,key=lambda i: float(rows[i]["def"]))]["reson"] = DI
              for c in ["atk","def","hp","mdef","pdef","skill","stamina","magic","strength"]:
                  for r in rows: r[c] = fmt(r[c])
              return rows
          text = load_mb("TextResourceZhCnMB")
          nm = {i["StringKey"]: i["Text"] for i in text if "StringKey" in i and "Text" in i}
          boss = load_mb("BossBattleEnemyMB"); tw = load_mb("TowerBattleEnemyMB")
          for it in boss: it["_name"] = nm.get(it.get("NameKey",""),"")
          for it in tw: it["_name"] = nm.get(it.get("NameKey",""),"")
          for fn, items, is_t in [("quest.json", boss, False), ("tower.json", tw, True)]:
              rows = process(items, is_t)
              d = json.dumps({"date":"masterbook","cols":COLS,"rows":[[r[c] for c in COLS] for r in rows]}, ensure_ascii=False, separators=(",",":"))
              open("data/"+fn, "w", encoding="utf-8").write(d)
              print(fn, len(rows))
          PYEOF
          ls -la data

      - name: 抓取 PVP 官方主数据并生成映射（boi CDN）
        run: |
          pip install msgpack -q
          python3 - <<'PYEOF'
          import urllib.request, json, msgpack
          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=120).read()
          # 1) 官方 auth -> MasterVersion
          for ver in ["4.19.2", "4.19.0", "4.18.0"]:
              try:
                  headers = {"OrtegaDeviceType":"4","ortegaappversion":ver,"Content-Type":"application/octet-stream"}
                  r = urllib.request.Request("https://prd1-auth.mememori-boi.com/api/auth/getDataUri", data=msgpack.packb({"CountryCode":"JP","UserId":0}), headers=headers, method="POST")
                  mver = dict(urllib.request.urlopen(r, timeout=30).headers)["ortegamasterversion"]
                  break
              except Exception:
                  continue
          else:
              raise RuntimeError("getDataUri failed")
          base = "https://cdn-mememori.akamaized.net/master/prd1/version/%s/" % mver
          def load_mb(name): return msgpack.unpackb(fetch(base + name))
          t = {i["StringKey"]: i["Text"] for i in load_mb("TextResourceZhCnMB") if "StringKey" in i and "Text" in i}
          ELEM = {"Blue":"\u84dd","Red":"\u7ea2","Green":"\u7eff","Yellow":"\u9ec4","Light":"\u5149","Dark":"\u6697"}
          RAR = {0:"\u65e0",1:"N",2:"R",4:"R+",8:"SR",16:"SR+",32:"SSR",64:"SSR+",128:"UR",256:"UR+",512:"LR",1024:"LR+",2048:"LR+2",4096:"LR+3",8192:"LR+4",16384:"LR+5",32768:"LR+6",65536:"LR+7",131072:"LR+8",262144:"LR+9",524288:"LR+10"}
          def save(n, d):
              open("data/"+n, "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, separators=(",",":")))
          cmap = {}
          for c in load_mb("CharacterMB"):
              cmap[str(c["Id"])] = {"n":t.get(c.get("NameKey"),c.get("Memo","")),"e":ELEM.get(c.get("ElementType"),str(c.get("ElementType"))),"j":c.get("JobFlags"),"nor":c.get("NormalSkillId"),"act":c.get("ActiveSkillIds") or [],"pas":c.get("PassiveSkillIds") or []}
          save("pvp_char.json", cmap)
          smap = {}
          for MB, pre, dkf in [("ActiveSkillMB","a","ActiveSkillInfos"), ("PassiveSkillMB","p","PassiveSkillInfos")]:
              for s in load_mb(MB):
                  desc = ""
                  infos = s.get(dkf) or []
                  if infos and isinstance(infos[0], dict) and infos[0].get("DescriptionKey"): desc = t.get(infos[0]["DescriptionKey"], "")
                  smap[pre+"_"+str(s["Id"])] = {"n":t.get(s.get("NameKey"),s.get("Memo","")),"d":desc}
          save("pvp_skill.json", smap)
          emap = {}
          for e in load_mb("EquipmentMB"):
              emap[str(e["Id"])] = {"n":t.get(e.get("NameKey"),e.get("Memo","")),"r":RAR.get(e.get("RarityFlags"),str(e.get("RarityFlags"))),"s":e.get("SlotType"),"lv":e.get("EquipmentLv"),"ic":e.get("IconId")}
          save("pvp_equip.json", emap)
          def slotmap(items, fields): return {str(x["Lv"]): {k: x.get(k) for k in fields} for x in items}
          save("pvp_legend.json", slotmap(load_mb("EquipmentLegendSacredTreasureMB"), ["WeaponAttackPowerPercent","SubHitPercent","GauntletCriticalDamagePercent","HelmetPhysicalCriticalDamageRelaxPercent","ArmorMagicCriticalDamageRelaxPercent","ShoesHpDrainPercent"]))
          save("pvp_matchless.json", slotmap(load_mb("EquipmentMatchlessSacredTreasureMB"), ["WeaponAttackPower","SubPhysicalDamageRelax","GauntletMagicDamageRelax","HelmetCritical","ArmorDefensePenetration","ShoesHp"]))
          spmap = {}
          for s in load_mb("SphereMB"):
              v = None
              if s.get("BaseParameterChangeInfo") and s["BaseParameterChangeInfo"].get("Value") is not None: v = s["BaseParameterChangeInfo"]["Value"]
              elif s.get("BattleParameterChangeInfo") and s["BattleParameterChangeInfo"].get("Value") is not None: v = s["BattleParameterChangeInfo"]["Value"]
              spmap[str(s["Id"])] = {"n":t.get(s.get("NameKey"),s.get("Memo","")),"d":t.get(s.get("DescriptionKey"),""),"v":v,"r":RAR.get(s.get("RarityFlags"),str(s.get("RarityFlags"))),"cat":s.get("CategoryId"),"t":s.get("SphereType"),"lv":s.get("Lv")}
          save("pvp_sphere.json", spmap)
          ATTRMAP = {1:"\u84dd",2:"\u7ea2",3:"\u7eff",4:"\u91d1",5:"\u5149",6:"\u6697"}
          cattr = {}
          for c in load_mb("CharacterMB"):
              et = c.get("ElementType")
              if et in ATTRMAP: cattr[str(c["Id"])] = ATTRMAP[et]
          save("char_attr.json", cattr)

          print("pvp maps done, mver:", mver)
          PYEOF

      - name: 生成角色技能数据(官方源)
        run: |
          pip install msgpack -q
          python3 skill_gen.py

      - name: 写入缓存时间戳
        run: printf '{"time":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/cache_time.json
      - name: 提交数据更新到 main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "数据缓存更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
