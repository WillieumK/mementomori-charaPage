name: 更新音乐列表
on:
  schedule:
    # 每 6 小时更新一次（UTC），源: rainsillwood/mementomori-Sound
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 生成音乐列表
        run: |
          pip install msgpack -q
          python3 - <<'PYEOF'
          import json, shutil, re, subprocess, sys, tempfile, urllib.request, msgpack, datetime
          SRC="https://github.com/rainsillwood/mementomori-Sound.git"
          def fetch(url, headers=None, timeout=120):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=timeout).read()
          def keep(msg):
              # 抓取环节出问题时保留上一版列表并正常退出，避免整条工作流变红
              print("::warning::跳过本次更新：%s（保留现有 data/music.json）" % msg)
              sys.exit(0)
          def list_flacs():
              # GitHub 的 git/trees API 匿名调用会被限流或返回 500，改用 partial clone 只取文件树（不下载音频）
              tmp = tempfile.mkdtemp(prefix="soundtree-")
              try:
                  subprocess.run(["git","clone","--filter=blob:none","--no-checkout","--depth","1","--no-tags","--quiet",SRC,tmp], check=True)
                  out = subprocess.run(["git","-C",tmp,"ls-tree","-r","--name-only","HEAD"], check=True, capture_output=True, text=True).stdout
                  return [l for l in out.splitlines() if l.endswith(".flac")]
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
          try:
              flacs = list_flacs()
          except Exception as e:
              keep("拉取音源文件列表失败: %r" % e)
          if not flacs:
              keep("音源文件列表为空")
          mver=None
          for ver in ["4.19.2","4.19.0","4.18.0"]:
              try:
                  hh={"OrtegaDeviceType":"4","ortegaappversion":ver,"Content-Type":"application/octet-stream"}
                  r=urllib.request.Request("https://prd1-auth.mememori-boi.com/api/auth/getDataUri", data=msgpack.packb({"CountryCode":"JP","UserId":0}), headers=hh, method="POST")
                  mver=dict(urllib.request.urlopen(r, timeout=30).headers)["ortegamasterversion"]; break
              except Exception: continue
          if not mver:
              keep("getDataUri 未返回 ortegamasterversion")
          try:
              base="https://cdn-mememori.akamaized.net/master/prd1/version/%s/"%mver
              def load_mb(n): return msgpack.unpackb(fetch(base+n))
              texts={i["StringKey"]:i["Text"] for i in load_mb("TextResourceZhCnMB") if "StringKey" in i and "Text" in i}
              cmap={}
              for c in load_mb("CharacterMB"):
                  try: cmap[int(c["Id"])]=texts.get(c.get("NameKey"),"")
                  except Exception: pass
          except Exception as e:
              keep("读取官方主数据失败: %r" % e)
          CDN="https://cdn.jsdelivr.net/gh/rainsillwood/mementomori-Sound@main/"
          SHO="\u77ed\u7248"; SONG="\u89d2\u8272\u6b4c"; CHARP="\u89d2\u8272"
          tracks=[]
          for p in sorted(flacs):
              m=re.match(r"CharacterSong/(CHR_(\d+))/CHR_\d+_SONG_SHORT_JP\.flac$", p)
              if not m: continue
              d,cid=m.group(1),int(m.group(2)); cid6=str(cid).zfill(6)
              name=cmap.get(cid, CHARP+" "+cid6)
              tracks.append({"id":"chr"+cid6,"title":name+" "+str(cid),"sub":SONG+" \u00b7 JP "+SHO,"src":CDN+p})
          if not tracks:
              keep("本次未解析出任何曲目")
          prev=0
          try: prev=len(json.load(open("data/music.json",encoding="utf-8")).get("tracks",[]))
          except Exception: pass
          if prev and len(tracks) < prev//2:
              keep("本次仅解析出 %d 首（现有 %d 首），疑似源数据异常" % (len(tracks), prev))
          out={"date":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),"source":"rainsillwood/mementomori-Sound","tracks":tracks}
          open("data/music.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,separators=(",",":")))
          print("music.json tracks:", len(tracks))
          PYEOF

      - name: 提交音乐列表
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/music.json
          if ! git diff --cached --quiet; then
            git commit -m "音乐列表更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi